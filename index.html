<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Snake Game</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div id="lobby" class="text-center">
        <h1 class="text-4xl font-bold mb-8">P2P Snake Game</h1>
        <div class="space-y-4">
            <button id="create-game" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                Create Game
            </button>
            <div id="game-id-display" class="hidden">
                <p>Share this ID with your friend:</p>
                <input id="game-id" type="text" readonly class="bg-gray-800 text-white text-center p-2 rounded w-full">
            </div>
            <hr class="border-gray-700 my-4">
            <div>
                <input id="join-id-input" type="text" placeholder="Enter Friend's ID" class="bg-gray-800 text-white p-2 rounded">
                <button id="join-game" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded ml-2">
                    Join Game
                </button>
            </div>
        </div>
        <p id="status" class="mt-4 text-gray-400"></p>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="game-canvas" width="600" height="600" class="bg-gray-800"></canvas>
    </div>

    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
